# peachycheck's configuration: https://github.com/drexlerd/peachycheck#configuration
ENABLE_LINTERS: [PYTHON_RUFF, PYTHON_RUFF_FORMAT, PYTHON_PYRIGHT, CPP_CLANG_TIDY, CPP_CLANG_FORMAT]
# The module file holds nothing but nanobind's module macro, whose global and C variadic call are
# nanobind's. The downstream package's extension is built only by its packaging test, against the
# installed wheel, so no build here has a compile command for it.
CPP_CLANG_TIDY_FILTER_REGEX_EXCLUDE: '^(python/src/module|python/tests/downstream/minimal_downstream_package/src/downstream_tyr_user/_downstream_tyr)\.cpp$'
