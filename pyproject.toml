[build-system]
requires = [
    "scikit-build-core>=1.0.3,<2",
    "nanobind-backend>=1.0",
    "pyyggdrasil>=0.12.0,<0.13",
    "pyurd>=0.5.0,<0.6",
    "pybrokkr>=0.3.0,<0.4",
    "pypddl>=1.13.0,<1.14",
]
build-backend = "pytyr_build_backend"
backend-path = ["python"]

[project]
name = "pytyr"
version = "0.11.0"
description = "Tyr datalog/planning library"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    {name = "Dominik Drexler", email = "dominik.drexler@liu.se"},
]
dependencies = [
    "nanobind-backend>=1.0",
    "pyyggdrasil>=0.12.0,<0.13",
    "pyurd>=0.5.0,<0.6",
    "pybrokkr>=0.3.0,<0.4",
    "pypddl>=1.13.0,<1.14",
]

[project.urls]
Homepage = "https://github.com/planning-and-learning/tyr"

[project.optional-dependencies]
test = [
    "pytest",
    "pypddl-datasets>=0.0.17,<0.1",
    # override and TypeIs for Python 3.11, in the tests, examples and fixture generators.
    "typing-extensions>=4.10",
]

# The documentation (docs/*.rst) wraps at 120 columns.
[tool.doc8]
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["."]

[tool.scikit-build]
# A persistent build directory per wheel tag: a reinstall rebuilds only what changed.
build-dir = "build/wheel/{wheel_tag}"
build.targets = ["pytyr_wheel"]
cmake.build-type = "Release"
install.components = ["pytyr"]
wheel.packages = []
wheel.py-api = "cp311"

[tool.scikit-build.sdist]
include = [
    "CMakeLists.txt",
    "Config.cmake.in",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "python/**",
    "docs/serialization/**",
    "include/**",
    "src/**",
]
exclude = [
    "build*/**",
    "python/src/pytyr.egg-info/**",
    "*.egg-info/**",
    "benchmark-results/**",
]

[tool.scikit-build.cmake.define]
TYR_BUILD_PYTYR = true
TYR_BUILD_TESTS = false
TYR_BUILD_EXECUTABLES = false
TYR_BUILD_BENCHMARKS = false
TYR_USE_LLD = false
TYR_ENABLE_LTO = {env = "TYR_ENABLE_LTO", default = false}
CMAKE_INSTALL_LIBDIR = "lib"
TYR_HEADER_INSTANTIATION = {env = "TYR_HEADER_INSTANTIATION", default = false}
TYR_ENABLE_INNER_PARALLELISM = {env = "TYR_ENABLE_INNER_PARALLELISM", default = false}
TYR_ENABLE_SEMI_NAIVE = {env = "TYR_ENABLE_SEMI_NAIVE", default = true}

[tool.cibuildwheel]
build = "cp311-*"
container-engine = "docker"
# Build in the cibuildwheel environment (not a fresh isolated env) so the
# provider install below — which retries to absorb TestPyPI index-propagation
# lag — is the single source of build dependencies. With build isolation the
# build would re-resolve build-system.requires from the index with no retry.
# Because --no-isolation also skips scikit-build-core's dynamic build tools,
# cmake/ninja must be installed here too (manylinux ships cmake but not ninja).
build-frontend = { name = "build", args = ["--no-isolation"] }
before-build = "n=0; until python -m pip install --no-cache-dir 'scikit-build-core>=1.0.3,<2' 'cmake>=3.21' 'ninja>=1.5' 'nanobind-backend>=1.0' 'pyyggdrasil>=0.12.0,<0.13' 'pypddl>=1.13.0,<1.14' 'pybrokkr>=0.3.0,<0.4'; do n=$((n+1)); [ $n -ge 30 ] && exit 1; echo 'provider wheels not on the index yet; retrying in 60s'; sleep 60; done"

[tool.cibuildwheel.linux]
repair-wheel-command = "python -m pyurd.repair --providers pypddl,pyyggdrasil,pyurd_native --dest-dir {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "python -m pyurd.repair --providers pypddl,pyyggdrasil,pyurd_native --require-archs {delocate_archs} --dest-dir {dest_dir} {wheel}"
