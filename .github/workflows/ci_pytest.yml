name: CI Pytest

on:
  push:
    branches-ignore:
      - test-pypi
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            relation_storage_policy: Bit
          - os: macos-latest
            python-version: "3.13"
            relation_storage_policy: Word

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CMake on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install dependencies and requirements
        run: |
          python -m pip install --no-cache-dir --upgrade pip
        env:
          PIP_NO_CACHE_DIR: 1
          YGGDRASIL_JOBS: 2
          LOKI_JOBS: 2

      - name: Build and install
        run: python -m pip install --no-cache-dir --verbose .[test]
        env:
          PIP_NO_CACHE_DIR: 1
          TYR_JOBS: 2
          YGGDRASIL_JOBS: 2
          LOKI_JOBS: 2
          TYR_HEADER_INSTANTIATION: OFF
          TYR_ENABLE_LTO: OFF
          TYR_RELATION_STORAGE_POLICY: ${{ matrix.relation_storage_policy }}

      - name: Test
        run: pytest python/tests
